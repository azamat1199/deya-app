# Build commands and redirects are deliberately absent: @netlify/plugin-nextjs
# derives both from next.config.ts, and declaring them here would shadow it.
#
# NEXT_PUBLIC_ values are inlined into the client bundle at build time and ship
# to every visitor, so only public configuration belongs in this block. Secrets
# go in the Netlify UI as non-public vars, never here.
[build.environment]
  NEXT_PUBLIC_API_URL = "https://deya.uz"
